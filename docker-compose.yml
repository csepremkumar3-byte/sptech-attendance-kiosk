services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sptech_kiosk_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_DIALECT=sqlite
      - DB_STORAGE=/app/data/database.sqlite
      - JWT_SECRET=sptech_super_secret_jwt_key_2026_production
      - JWT_EXPIRES_IN=7d
      - FACE_SIMILARITY_THRESHOLD=0.55
      - LIVENESS_THRESHOLD=0.60
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./backend/data:/app/data
      - ./backend/database.sqlite:/app/database.sqlite
      - ./uploads:/app/uploads
