services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sptech_kiosk_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_DIALECT=sqlite
      - DB_STORAGE=/app/data/database.sqlite
      - JWT_SECRET=sptech_super_secret_jwt_key_2026_production
      - JWT_EXPIRES_IN=7d
      - FACE_SIMILARITY_THRESHOLD=0.55
      - LIVENESS_THRESHOLD=0.60
      - AI_BIOMETRIC_URL=http://ai_service:5001
    depends_on:
      - ai_service
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./backend/data:/app/data
      - ./backend/database.sqlite:/app/database.sqlite
      - ./uploads:/app/uploads

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: sptech_ai_service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
